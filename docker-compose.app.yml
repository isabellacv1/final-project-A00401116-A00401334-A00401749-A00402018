# Application layer for CircleGuard: the five core services and the web app.
#
# Run together with the infrastructure file:
#   docker compose -f docker-compose.dev.yml -f docker-compose.app.yml up -d --build
#
# Inside the network services reach each other by service name
# (postgres, neo4j, redis, kafka, openldap, identity, ...). Kafka uses the
# INTERNAL listener on kafka:29092 because the host listener advertises
# localhost:9092 and would be unreachable from inside a container.

services:
  auth:
    image: circleguard/auth-service:1.0.0
    build:
      context: .
      dockerfile: services/circleguard-auth-service/Dockerfile
    container_name: circleguard-auth-service
    ports:
      - "8180:8180"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/circleguard_auth
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      IDENTITY_API_URL: http://identity:8083
      SPRING_LDAP_URLS: ldap://openldap:389
      SPRING_LDAP_BASE: dc=circleguard,dc=edu
      SPRING_LDAP_USERNAME: cn=admin,dc=circleguard,dc=edu
      SPRING_LDAP_PASSWORD: admin
      # qr.expiration is read as milliseconds; without this override the
      # generated token lives 300 ms and the gateway sees it already expired.
      QR_EXPIRATION: 60000
    networks:
      - circleguard-net
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
      openldap:
        condition: service_healthy

  identity:
    image: circleguard/identity-service:1.0.0
    build:
      context: .
      dockerfile: services/circleguard-identity-service/Dockerfile
    container_name: circleguard-identity-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/circleguard_identity
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - circleguard-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  promotion:
    image: circleguard/promotion-service:1.0.0
    build:
      context: .
      dockerfile: services/circleguard-promotion-service/Dockerfile
    container_name: circleguard-promotion-service
    ports:
      - "8088:8088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/circleguard_promotion
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - circleguard-net
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  form:
    image: circleguard/form-service:1.0.0
    build:
      context: .
      dockerfile: services/circleguard-form-service/Dockerfile
    container_name: circleguard-form-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/circleguard_form
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - circleguard-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  gateway:
    image: circleguard/gateway-service:1.0.0
    build:
      context: .
      dockerfile: services/circleguard-gateway-service/Dockerfile
    container_name: circleguard-gateway-service
    ports:
      - "8087:8087"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    networks:
      - circleguard-net
    depends_on:
      redis:
        condition: service_healthy

  web:
    image: circleguard/web:1.0.0
    build:
      context: mobile
      dockerfile: Dockerfile
    container_name: circleguard-web
    # Published on 8081 because the services' CORS policy only accepts
    # browser requests from http://localhost:8081 (and :8080).
    ports:
      - "8081:8080"
    environment:
      # These URLs are used by the browser, not by the container, so they point
      # at the ports published on the host, not at service names.
      AUTH_BASE_URL: http://localhost:8180
      IDENTITY_BASE_URL: http://localhost:8083
      FORM_BASE_URL: http://localhost:8086
      GATEWAY_BASE_URL: http://localhost:8087
      PROMOTION_BASE_URL: http://localhost:8088
    networks:
      - circleguard-net
    depends_on:
      auth:
        condition: service_started
      identity:
        condition: service_started
      promotion:
        condition: service_started
      form:
        condition: service_started
      gateway:
        condition: service_started
