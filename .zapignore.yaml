# Excepciones justificadas del baseline de OWASP ZAP.
#
# El step zapBaselineScan solo lee este archivo cuando existe. Cada entrada debe
# incluir `id` (pluginid de ZAP), `statement` (justificación con evidencia) y un
# `expired_at` con fecha futura válida: una excepción sin fecha, con fecha
# inválida o caducada NO se aplica (fail closed) y el hallazgo vuelve a bloquear.
#
# Un finding exceptuado NO se elimina: sigue presente en el HTML/JSON archivado,
# solo deja de contar para la decisión del gate.
#
# Plantilla (copiar y rellenar solo con una justificación real):
#   - id: "10015"
#     scope: "http://10.20.2.113/.*"   # regex opcional sobre la URL del alert
#     statement: >-
#       Por qué se acepta este hallazgo, con evidencia y riesgo aceptado.
#     approved_by: reviewer
#     expired_at: 2027-05-17
exceptions: []
