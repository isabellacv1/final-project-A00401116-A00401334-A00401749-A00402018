apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-web
  namespace: circleguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: circleguard-web
      app.kubernetes.io/instance: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: circleguard-web
        app.kubernetes.io/instance: web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: circleguard
    spec:
      imagePullSecrets:
        - name: nexus-pull-secret
      containers:
        - name: web
          image: 10.20.1.230:8082/circleguard/web:1.0.0-dev.10
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
