apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-identity-service
  namespace: circleguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: circleguard-identity-service
      app.kubernetes.io/instance: identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: circleguard-identity-service
        app.kubernetes.io/instance: identity
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: circleguard
    spec:
      imagePullSecrets:
        - name: nexus-pull-secret
      containers:
        - name: identity-service
          image: 10.20.1.230:8082/circleguard/identity-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: circleguard-common-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: circleguard-identity-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: circleguard-identity-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: circleguard-identity-secret
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: circleguard-identity-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: circleguard-identity-secret
                  key: JWT_SECRET
            - name: VAULT_SECRET
              valueFrom:
                secretKeyRef:
                  name: circleguard-identity-secret
                  key: VAULT_SECRET
            - name: VAULT_SALT
              valueFrom:
                secretKeyRef:
                  name: circleguard-identity-secret
                  key: VAULT_SALT
            - name: VAULT_HASH_SALT
              valueFrom:
                secretKeyRef:
                  name: circleguard-identity-secret
                  key: VAULT_HASH_SALT
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
