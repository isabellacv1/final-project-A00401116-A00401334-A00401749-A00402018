apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: circleguard
  namespace: circleguard
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  name: http
          - path: /api/v1/users
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  name: http
          - path: /api/v1/identities
            pathType: Prefix
            backend:
              service:
                name: identity
                port:
                  name: http
          - path: /api/v1/circles
            pathType: Prefix
            backend:
              service:
                name: promotion
                port:
                  name: http
          - path: /api/v1/mesh
            pathType: Prefix
            backend:
              service:
                name: promotion
                port:
                  name: http
          - path: /api/v1/buildings
            pathType: Prefix
            backend:
              service:
                name: promotion
                port:
                  name: http
          - path: /api/v1/floors
            pathType: Prefix
            backend:
              service:
                name: promotion
                port:
                  name: http
          - path: /api/v1/access-points
            pathType: Prefix
            backend:
              service:
                name: promotion
                port:
                  name: http
          - path: /api/v1/encounters
            pathType: Prefix
            backend:
              service:
                name: promotion
                port:
                  name: http
          - path: /api/v1/sessions
            pathType: Prefix
            backend:
              service:
                name: promotion
                port:
                  name: http
          - path: /api/v1/location
            pathType: Prefix
            backend:
              service:
                name: promotion
                port:
                  name: http
          - path: /api/v1/health
            pathType: Prefix
            backend:
              service:
                name: promotion
                port:
                  name: http
          - path: /api/v1/health-status
            pathType: Prefix
            backend:
              service:
                name: promotion
                port:
                  name: http
          - path: /api/v1/admin/settings
            pathType: Prefix
            backend:
              service:
                name: promotion
                port:
                  name: http
          - path: /api/v1/gate
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
          - path: /api/v1/questionnaires
            pathType: Prefix
            backend:
              service:
                name: form
                port:
                  name: http
          - path: /api/v1/surveys
            pathType: Prefix
            backend:
              service:
                name: form
                port:
                  name: http
          - path: /api/v1/attachments
            pathType: Prefix
            backend:
              service:
                name: form
                port:
                  name: http
          - path: /api/v1/certificates
            pathType: Prefix
            backend:
              service:
                name: form
                port:
                  name: http
          - path: /api/v1/files
            pathType: Prefix
            backend:
              service:
                name: file
                port:
                  name: http
          - path: /api/v1/analytics
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  name: http
