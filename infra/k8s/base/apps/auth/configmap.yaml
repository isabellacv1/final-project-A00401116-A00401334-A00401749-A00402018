apiVersion: v1
kind: ConfigMap
metadata:
  name: circleguard-auth-config
  namespace: circleguard
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres.circleguard-data.svc.cluster.local:5432/circleguard_auth
  SPRING_DATASOURCE_USERNAME: admin
  SPRING_LDAP_URLS: ldap://openldap.circleguard-data.svc.cluster.local:389
  SPRING_LDAP_BASE: dc=circleguard,dc=edu
  SPRING_LDAP_USERNAME: cn=admin,dc=circleguard,dc=edu
  IDENTITY_API_URL: http://identity:8083
  CORS_ALLOWED_ORIGINS: http://localhost:8081,http://localhost:8080
  QR_EXPIRATION: "60000"
