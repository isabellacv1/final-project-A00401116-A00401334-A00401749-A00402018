apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: circleguard-data
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: circleguard
    circleguard.io/managed-by: kustomize
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
