apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: circleguard-data
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/component: graph
    app.kubernetes.io/part-of: circleguard
    circleguard.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
      protocol: TCP
