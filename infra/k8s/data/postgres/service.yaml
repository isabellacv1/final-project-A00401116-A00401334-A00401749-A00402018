apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: circleguard-data
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: circleguard
    circleguard.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
