# cert-manager (HU-35, TLS): issues and renews the certificates of the cluster.
# Pinned official release, applied once per cluster by infrastructure (admin context):
#   kubectl apply -k infra/k8s/cert-manager
#   kubectl -n cert-manager rollout status deploy/cert-manager-webhook
# It must be running before infra/k8s/tls/overlays/<env> is applied (that root uses its CRDs).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
