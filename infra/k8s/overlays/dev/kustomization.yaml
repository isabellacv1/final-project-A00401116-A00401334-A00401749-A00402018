apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
components:
  - ../../platform/base/observability/scrape-annotations
  - ../../components/rolling-update
  - ../../components/hpa
labels:
  - pairs:
      circleguard.io/environment: dev
    includeSelectors: false
images:
  - name: 10.20.1.230:8082/circleguard/web
    newTag: 1.0.0-dev.10
  - name: 10.20.1.230:8082/circleguard/auth-service
    newTag: 1.0.0-dev.10
  - name: 10.20.1.230:8082/circleguard/identity-service
    newTag: 1.0.0-dev.10
  - name: 10.20.1.230:8082/circleguard/promotion-service
    newTag: 1.0.0-dev.10
  - name: 10.20.1.230:8082/circleguard/notification-service
    newTag: 1.0.0-dev.10
  - name: 10.20.1.230:8082/circleguard/form-service
    newTag: 1.0.0-dev.10
  - name: 10.20.1.230:8082/circleguard/gateway-service
    newTag: 1.0.0-dev.10
  - name: 10.20.1.230:8082/circleguard/dashboard-service
    newTag: 1.0.0-dev.10
  - name: 10.20.1.230:8082/circleguard/file-service
    newTag: 1.0.0-dev.10
patches:
  # dev has a single small node and a tight quota (circleguard-quota). The pipeline applies the
  # nine Deployments at once, so with the HU-30 strategy (maxSurge 1) nine extra pods are requested
  # at the same time and the quota rejects them ("exceeded quota"), which hangs the rollout.
  # In dev each service replaces its pod instead: the old pod stops and the new one starts, with no
  # extra quota. Stage and prod keep the zero-downtime strategy of components/rolling-update.
  - target:
      group: apps
      version: v1
      kind: Deployment
      namespace: circleguard
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: any
      spec:
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
        # The nine Java services restart at the same time on a 2 vCPU node, so a service can
        # take more than two minutes to start (auth needed ~135 s in build #60). The rollout is
        # reported as failed after 10 minutes instead of 5.
        progressDeadlineSeconds: 600
  # Startup probe budget for the backend services in dev: 60 x 5 s = 5 minutes instead of
  # 30 x 5 s. With the shorter budget the kubelet restarted auth while it was still starting,
  # which doubled its startup time.
  - target:
      group: apps
      version: v1
      kind: Deployment
      namespace: circleguard
      name: circleguard-.*-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/failureThreshold
        value: 60
  - target:
      kind: ConfigMap
      name: circleguard-common-config
      namespace: circleguard
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: circleguard-common-config
        namespace: circleguard
      data:
        SPRING_PROFILES_ACTIVE: dev
  - target:
      kind: ConfigMap
      name: circleguard-notification-config
      namespace: circleguard
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: circleguard-notification-config
        namespace: circleguard
      data:
        SPRING_MAIL_HOST: reemplazar-smtp-host-dev.invalid
