apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../observability
components:
  - ../../observability/scrape-annotations
labels:
  - pairs:
      circleguard.io/environment: dev
    includeSelectors: false
images:
  - name: 10.20.1.230:8082/circleguard/web
    newTag: 1.0.0-dev.10
  - name: 10.20.1.230:8082/circleguard/auth-service
    newTag: 1.0.0-dev.10
  - name: 10.20.1.230:8082/circleguard/identity-service
    newTag: 1.0.0-dev.10
  - name: 10.20.1.230:8082/circleguard/promotion-service
    newTag: 1.0.0-dev.10
  - name: 10.20.1.230:8082/circleguard/notification-service
    newTag: 1.0.0-dev.10
  - name: 10.20.1.230:8082/circleguard/form-service
    newTag: 1.0.0-dev.10
  - name: 10.20.1.230:8082/circleguard/gateway-service
    newTag: 1.0.0-dev.10
  - name: 10.20.1.230:8082/circleguard/dashboard-service
    newTag: 1.0.0-dev.10
  - name: 10.20.1.230:8082/circleguard/file-service
    newTag: 1.0.0-dev.10
patches:
  - target:
      kind: ConfigMap
      name: circleguard-common-config
      namespace: circleguard
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: circleguard-common-config
        namespace: circleguard
      data:
        SPRING_PROFILES_ACTIVE: dev
  - target:
      kind: ConfigMap
      name: circleguard-notification-config
      namespace: circleguard
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: circleguard-notification-config
        namespace: circleguard
      data:
        SPRING_MAIL_HOST: reemplazar-smtp-host-dev.invalid
