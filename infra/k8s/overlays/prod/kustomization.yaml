apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      circleguard.io/environment: prod
    includeSelectors: false
images:
  - name: 10.20.1.230:8082/circleguard/auth-service
    newTag: 1.0.0
  - name: 10.20.1.230:8082/circleguard/identity-service
    newTag: 1.0.0
  - name: 10.20.1.230:8082/circleguard/promotion-service
    newTag: 1.0.0
  - name: 10.20.1.230:8082/circleguard/notification-service
    newTag: 1.0.0-dev.10
  - name: 10.20.1.230:8082/circleguard/form-service
    newTag: 1.0.0
  - name: 10.20.1.230:8082/circleguard/gateway-service
    newTag: 1.0.0
  - name: 10.20.1.230:8082/circleguard/dashboard-service
    newTag: 1.0.0-dev.10
  - name: 10.20.1.230:8082/circleguard/file-service
    newTag: 1.0.0-dev.10
patches:
  - target:
      kind: ResourceQuota
      name: circleguard-quota
    patch: |-
      apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: circleguard-quota
      spec:
        hard:
          requests.cpu: "1400m"
          requests.memory: 6Gi
          limits.cpu: "6"
          limits.memory: 12Gi
          requests.storage: 10Gi
  - target:
      kind: ResourceQuota
      name: circleguard-data-quota
    patch: |-
      apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: circleguard-data-quota
      spec:
        hard:
          requests.cpu: "1200m"
          requests.memory: 4Gi
          limits.cpu: "4"
          limits.memory: 8Gi
          requests.storage: 20Gi
  - target:
      kind: ResourceQuota
      name: circleguard-observability-quota
    patch: |-
      apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: circleguard-observability-quota
      spec:
        hard:
          requests.cpu: "600m"
          requests.memory: 2Gi
          limits.cpu: "2"
          limits.memory: 4Gi
          requests.storage: 6Gi
          pods: "10"
  - target:
      kind: ConfigMap
      name: circleguard-common-config
      namespace: circleguard
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: circleguard-common-config
        namespace: circleguard
      data:
        SPRING_PROFILES_ACTIVE: prod
  - target:
      kind: ConfigMap
      name: circleguard-auth-config
      namespace: circleguard
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: circleguard-auth-config
        namespace: circleguard
      data:
        CORS_ALLOWED_ORIGINS: http://reemplazar-host-web-prod.invalid:8081
  - target:
      kind: ConfigMap
      name: circleguard-gateway-config
      namespace: circleguard
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: circleguard-gateway-config
        namespace: circleguard
      data:
        CORS_ALLOWED_ORIGINS: http://reemplazar-host-web-prod.invalid:8081
  - target:
      kind: ConfigMap
      name: circleguard-notification-config
      namespace: circleguard
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: circleguard-notification-config
        namespace: circleguard
      data:
        SPRING_MAIL_HOST: reemplazar-smtp-host-prod.invalid
