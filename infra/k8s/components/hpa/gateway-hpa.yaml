apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: circleguard-gateway-hpa
  namespace: circleguard
  labels:
    app.kubernetes.io/name: circleguard-gateway-hpa
    app.kubernetes.io/instance: gateway
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/part-of: circleguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: circleguard-gateway-service
  minReplicas: 1
  maxReplicas: 2
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
