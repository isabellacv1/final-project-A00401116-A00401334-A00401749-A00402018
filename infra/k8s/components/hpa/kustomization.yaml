apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - gateway-hpa.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: circleguard-gateway-service
      namespace: circleguard
    patch: |-
      - op: remove
        path: /spec/replicas
