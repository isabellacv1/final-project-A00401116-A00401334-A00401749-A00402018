apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      circleguard.io/environment: prod
    includeSelectors: false
patches:
  - target:
      kind: ResourceQuota
      name: circleguard-quota
    patch: |-
      apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: circleguard-quota
      spec:
        hard:
          requests.cpu: "1400m"
          requests.memory: 6Gi
          limits.cpu: "6"
          limits.memory: 12Gi
          requests.storage: 10Gi
  - target:
      kind: ResourceQuota
      name: circleguard-data-quota
    patch: |-
      apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: circleguard-data-quota
      spec:
        hard:
          requests.cpu: "1200m"
          requests.memory: 4Gi
          limits.cpu: "4"
          limits.memory: 8Gi
          requests.storage: 20Gi
  - target:
      kind: ResourceQuota
      name: circleguard-observability-quota
    patch: |-
      apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: circleguard-observability-quota
      spec:
        hard:
          requests.cpu: "600m"
          requests.memory: 2Gi
          limits.cpu: "3"
          limits.memory: 5Gi
          requests.storage: 6Gi
          pods: "12"
