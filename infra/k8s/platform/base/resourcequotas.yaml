apiVersion: v1
kind: ResourceQuota
metadata:
  name: circleguard-quota
  namespace: circleguard
spec:
  hard:
    requests.cpu: "700m"
    requests.memory: 3072Mi
    limits.cpu: "6"
    limits.memory: 8Gi
    requests.storage: 8Gi
    pods: "20"
    services: "12"
    services.nodeports: "0"
    services.loadbalancers: "0"
    persistentvolumeclaims: "4"
    count/deployments.apps: "12"
    count/statefulsets.apps: "2"
    count/ingresses.networking.k8s.io: "2"
    count/configmaps: "20"
    count/secrets: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: circleguard-data-quota
  namespace: circleguard-data
spec:
  hard:
    requests.cpu: "700m"
    requests.memory: 2560Mi
    limits.cpu: "4"
    limits.memory: 6Gi
    requests.storage: 16Gi
    pods: "12"
    services: "10"
    services.nodeports: "0"
    services.loadbalancers: "0"
    persistentvolumeclaims: "6"
    count/deployments.apps: "4"
    count/statefulsets.apps: "8"
    count/configmaps: "10"
    count/secrets: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: circleguard-observability-quota
  namespace: circleguard-observability
spec:
  hard:
    requests.cpu: "400m"
    requests.memory: 1536Mi
    limits.cpu: "2"
    limits.memory: 3Gi
    requests.storage: 4Gi
    pods: "10"
    services: "6"
    services.nodeports: "0"
    services.loadbalancers: "0"
    persistentvolumeclaims: "5"
    count/deployments.apps: "4"
    count/statefulsets.apps: "4"
    count/daemonsets.apps: "2"
    count/ingresses.networking.k8s.io: "2"
    count/configmaps: "10"
    count/secrets: "10"
