global:
  resolve_timeout: 5m

route:
  receiver: discord
  # One message per alert and service, not one per pod
  group_by: [alertname, service, application, deployment, node]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Critical alerts are sent as soon as possible and repeated more often
    - matchers:
        - severity="critical"
      receiver: discord
      group_wait: 10s
      repeat_interval: 1h

# While a node is down, do not also send the alerts of the services running on it
inhibit_rules:
  - source_matchers:
      - alertname="NodeLowMemory"
    target_matchers:
      - severity="warning"
    equal: [node]

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/webhook-url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        message: |-
          {{ range .Alerts }}**{{ .Labels.severity | toUpper }}** {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
