groups:
  - name: circleguard-availability
    rules:
      - alert: CircleGuardServiceDown
        expr: up{job="circleguard-services"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is not answering"
          description: "Prometheus cannot read the metrics of pod {{ $labels.pod }} for more than 1 minute."

      - alert: CircleGuardDeploymentUnavailable
        expr: |
          kube_deployment_status_replicas_available{namespace=~"circleguard|circleguard-data"}
            < kube_deployment_spec_replicas{namespace=~"circleguard|circleguard-data"}
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.deployment }} has fewer replicas than expected"
          description: "Only {{ $value }} replicas available for 5 minutes in {{ $labels.namespace }}."

      - alert: CircleGuardPodRestarting
        expr: increase(kube_pod_container_status_restarts_total{namespace=~"circleguard|circleguard-data"}[15m]) > 2
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.pod }} is restarting"
          description: "Container {{ $labels.container }} restarted {{ $value | humanize }} times in 15 minutes (crash loop or memory limit)."

  - name: circleguard-performance
    rules:
      - alert: CircleGuardHighErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.application }} answers more than 5% with server errors"
          description: "{{ $value | humanizePercentage }} of the requests ended in 5xx during the last 5 minutes."

      # Same objective as the load tests (HU-32): p95 <= 500 ms
      - alert: CircleGuardHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (application, le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} p95 latency is above 500 ms"
          description: "p95 = {{ $value | humanizeDuration }} during the last 5 minutes."

      - alert: CircleGuardJvmHeapHigh
        expr: |
          sum by (application) (jvm_memory_used_bytes{area="heap"})
            / sum by (application) (jvm_memory_max_bytes{area="heap"} > 0) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} uses more than 90% of its heap"
          description: "Heap at {{ $value | humanizePercentage }} for 10 minutes, the service may run out of memory."

  - name: circleguard-infrastructure
    rules:
      - alert: NodeHighCpu
        expr: 1 - avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.node }} CPU above 85%"
          description: "CPU at {{ $value | humanizePercentage }} for 10 minutes."

      - alert: NodeLowMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node }} has less than 10% memory available"
          description: "Only {{ $value | humanizePercentage }} of the memory is available."

      - alert: NodeDiskAlmostFull
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.node }} disk {{ $labels.mountpoint }} below 15% free"
          description: "{{ $value | humanizePercentage }} free. Images and logs may stop being written."
