apiVersion: v1
kind: ServiceAccount
metadata:
  name: circleguard-deployer
  namespace: circleguard
  labels:
    app.kubernetes.io/part-of: circleguard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: circleguard-deployer
  labels:
    app.kubernetes.io/part-of: circleguard
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - events
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - resourcequotas
      - limitranges
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: circleguard-deployer
  namespace: circleguard
  labels:
    app.kubernetes.io/part-of: circleguard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: circleguard-deployer
subjects:
  - kind: ServiceAccount
    name: circleguard-deployer
    namespace: circleguard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: circleguard-deployer
  namespace: circleguard-data
  labels:
    app.kubernetes.io/part-of: circleguard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: circleguard-deployer
subjects:
  - kind: ServiceAccount
    name: circleguard-deployer
    namespace: circleguard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: circleguard-deployer
  namespace: circleguard-observability
  labels:
    app.kubernetes.io/part-of: circleguard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: circleguard-deployer
subjects:
  - kind: ServiceAccount
    name: circleguard-deployer
    namespace: circleguard
