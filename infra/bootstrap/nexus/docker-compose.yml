
services:
  nexus:
    image: sonatype/nexus3:${NEXUS_TAG:-3.95.4}
    container_name: nexus
    restart: unless-stopped

    ports:
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"

    environment:
      INSTALL4J_ADD_VM_PARAMS: >-
        -Xms${NEXUS_HEAP:-1200m}
        -Xmx${NEXUS_HEAP:-1200m}
        -XX:MaxDirectMemorySize=${NEXUS_DIRECT_MEMORY:-1200m}
        -Djava.util.prefs.userRoot=/nexus-data/javaprefs

    volumes:
      - nexus-data:/nexus-data

    stop_grace_period: 120s

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  nexus-data:
    name: circleguard-nexus-data
