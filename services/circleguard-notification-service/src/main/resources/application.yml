spring:
  application:
    name: circleguard-notification-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

auth:
  api:
    url: ${AUTH_API_URL:http://localhost:8180}

identity:
  api:
    url: ${IDENTITY_API_URL:http://localhost:8083}

# Canales externos. Los valores de ejemplo son marcadores de desarrollo:
# al habilitar los canales reales, las credenciales vienen del archivo de secretos.
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:AC_MOCK_SID}
  auth-token: ${TWILIO_AUTH_TOKEN:MOCK_TOKEN}
  from-number: ${TWILIO_FROM_NUMBER:+15550000000}

push:
  gotify:
    url: ${GOTIFY_URL:http://localhost:8080}
    token: ${GOTIFY_TOKEN:MOCK_TOKEN}

lms:
  api:
    url: ${LMS_API_URL:https://lms.university.edu/api/v1}

room:
  booking:
    api:
      url: ${ROOM_BOOKING_API_URL:https://facilities.university.edu/api/v1/rooms}

notification:
  url:
    testing: ${NOTIFICATION_URL_TESTING:https://circleguard.example.com/testing}
    isolation: ${NOTIFICATION_URL_ISOLATION:https://circleguard.example.com/isolation}
    guidelines: ${NOTIFICATION_URL_GUIDELINES:circleguard://guidelines}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

server:
  port: 8082
