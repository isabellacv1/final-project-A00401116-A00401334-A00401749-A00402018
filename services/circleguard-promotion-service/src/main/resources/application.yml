spring:
  application:
    name: circleguard-promotion-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/circleguard_promotion}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: promotion-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # HU-28: fail in 2 s instead of the 60 s default, so a Redis outage is
      # reported by the health probe (503) instead of hanging it.
      timeout: 2s
      connect-timeout: 2s

jwt:
  # Debe coincidir con el secret de auth (valida los tokens que emite auth).
  secret: ${JWT_SECRET}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

server:
  port: 8088


management:
  # Traces to Jaeger: off locally and in the tests, on in Kubernetes (component
  # infra/k8s/platform/base/observability/tracing sets TRACING_ENABLED and the endpoint)
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,neo4j,redis
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
