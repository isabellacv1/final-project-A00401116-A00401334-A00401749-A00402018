spring:
  application:
    name: circleguard-promotion-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/circleguard_promotion}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: promotion-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # HU-28: fail in 2 s instead of the 60 s default, so a Redis outage is
      # reported by the health probe (503) instead of hanging it.
      timeout: 2s
      connect-timeout: 2s

jwt:
  # Debe coincidir con el secret de auth (valida los tokens que emite auth).
  secret: ${JWT_SECRET}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

server:
  port: 8088

# HU-28: health probes used by the container HEALTHCHECK and by the deploy verification.
#   /actuator/health/liveness  -> the process answers (no dependencies)
#   /actuator/health/readiness -> the process can serve requests: includes the
#                                 dependencies this service cannot work without
# Only the health endpoint is exposed, without details.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,neo4j,redis
