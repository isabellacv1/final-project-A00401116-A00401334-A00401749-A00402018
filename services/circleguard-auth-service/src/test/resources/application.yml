jwt:
  secret: "my-super-secret-test-key-32-chars-long"
  expiration: 3600000

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  # The main application.yml is replaced by this file, and the LDAP password has no
  # default in code (HU-34): a missing secret must stop the service, not fall back.
  ldap:
    password: test-ldap-password
