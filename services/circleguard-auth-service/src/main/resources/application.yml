spring:
  application:
    name: circleguard-auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/circleguard_auth}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ldap:
    urls: ${LDAP_URL:ldap://localhost:389}
    base: ${LDAP_BASE:dc=circleguard,dc=edu}
    username: ${LDAP_USERNAME:cn=admin,dc=circleguard,dc=edu}
    password: ${LDAP_PASSWORD}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8080}

identity:
  api:
    url: ${IDENTITY_API_URL:http://localhost:8083}

jwt:
  # Obligatorio y compartido con identity, gateway, notification y promotion.
  # Minimo 32 caracteres (JJWT rechaza claves de menos de 256 bits).
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

qr:
  # Compartido con gateway y notification.
  secret: ${QR_SECRET}
  # Se interpreta en milisegundos.
  expiration: ${QR_EXPIRATION:60000}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

server:
  port: 8180

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,ldap
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

# HU-28: retry and circuit breaker for the calls to identity-service.
#   retry:           3 attempts, 500 ms apart, only on I/O errors (connection refused,
#                    timeout). A 4xx answer is a real answer and is not retried.
#   circuit breaker: opens when 50 % of the last 10 calls failed (at least 5 calls),
#                    stays open 30 s answering immediately, then lets 2 test calls
#                    through (half-open) to decide whether to close again.
resilience4j:
  retry:
    instances:
      identity:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  circuitbreaker:
    instances:
      identity:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
