spring:
  application:
    name: circleguard-auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/circleguard_auth}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ldap:
    urls: ${LDAP_URL:ldap://localhost:389}
    base: ${LDAP_BASE:dc=circleguard,dc=edu}
    username: ${LDAP_USERNAME:cn=admin,dc=circleguard,dc=edu}
    password: ${LDAP_PASSWORD}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8080}

identity:
  api:
    url: ${IDENTITY_API_URL:http://localhost:8083}

jwt:
  # Obligatorio y compartido con identity, gateway, notification y promotion.
  # Minimo 32 caracteres (JJWT rechaza claves de menos de 256 bits).
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

qr:
  # Compartido con gateway y notification.
  secret: ${QR_SECRET}
  # Se interpreta en milisegundos.
  expiration: ${QR_EXPIRATION:60000}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

server:
  port: 8180

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,ldap
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
