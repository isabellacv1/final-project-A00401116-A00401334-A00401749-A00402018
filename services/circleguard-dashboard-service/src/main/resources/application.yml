spring:
  application:
    name: circleguard-dashboard-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/circleguard_dashboard}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

circleguard:
  promotion-service:
    url: ${CIRCLEGUARD_PROMOTION_SERVICE_URL:http://localhost:8088}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

server:
  port: 8084

management:
  # Traces to Jaeger: off locally and in the tests, on in Kubernetes (component
  # infra/k8s/platform/base/observability/tracing sets TRACING_ENABLED and the endpoint)
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

# HU-28: retry and circuit breaker for the calls to promotion-service.
#   retry:           3 attempts, 500 ms apart, only on I/O errors (connection refused,
#                    timeout). A 4xx answer is a real answer and is not retried.
#   circuit breaker: opens when 50 % of the last 10 calls failed (at least 5 calls),
#                    stays open 30 s answering immediately, then lets 2 test calls
#                    through (half-open) to decide whether to close again.
resilience4j:
  retry:
    instances:
      promotion:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  circuitbreaker:
    instances:
      promotion:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
