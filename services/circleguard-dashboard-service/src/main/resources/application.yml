spring:
  application:
    name: circleguard-dashboard-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/circleguard_dashboard}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

circleguard:
  promotion-service:
    url: ${CIRCLEGUARD_PROMOTION_SERVICE_URL:http://localhost:8088}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
