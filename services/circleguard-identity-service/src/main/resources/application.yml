spring:
  application:
    name: circleguard-identity-service
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/circleguard_identity}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

vault:
  # Hexadecimales, obligatorios: protegen los datos identificables del vault.
  secret: ${VAULT_SECRET}
  salt: ${VAULT_SALT}
  hash-salt: ${VAULT_HASH_SALT}

jwt:
  # Debe coincidir con el secret de auth (valida los tokens que emite auth).
  secret: ${JWT_SECRET}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

server:
  port: 8083

management:
  # Traces to Jaeger: off locally and in the tests, on in Kubernetes (component
  # infra/k8s/platform/base/observability/tracing sets TRACING_ENABLED and the endpoint)
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
