spring:
  application:
    name: circleguard-form-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/circleguard_form}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    root: ${LOG_LEVEL:INFO}

server:
  port: 8086

# HU-28: health probes used by the container HEALTHCHECK and by the deploy verification.
#   /actuator/health/liveness  -> the process answers (no dependencies)
#   /actuator/health/readiness -> the process can serve requests: includes the
#                                 dependencies this service cannot work without
# Only the health endpoint is exposed, without details.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
