spring:
  application:
    name: circleguard-gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # HU-28: fail in 2 s instead of the 60 s default, so a Redis outage is
      # reported by the health probe (503) instead of hanging it.
      timeout: 2s
      connect-timeout: 2s

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8080}

qr:
  # Debe coincidir con el secret de auth (valida los codigos QR que emite).
  secret: ${QR_SECRET}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

server:
  port: 8087

# HU-28: health probes used by the container HEALTHCHECK and by the deploy verification.
#   /actuator/health/liveness  -> the process answers (no dependencies)
#   /actuator/health/readiness -> the process can serve requests: includes the
#                                 dependencies this service cannot work without
# Only the health endpoint is exposed, without details.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,redis
