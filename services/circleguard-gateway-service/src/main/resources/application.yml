spring:
  application:
    name: circleguard-gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # HU-28: fail in 2 s instead of the 60 s default, so a Redis outage is
      # reported by the health probe (503) instead of hanging it.
      timeout: 2s
      connect-timeout: 2s

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8080}

qr:
  # Debe coincidir con el secret de auth (valida los codigos QR que emite).
  secret: ${QR_SECRET}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

server:
  port: 8087

management:
  # Traces to Jaeger: off locally and in the tests, on in Kubernetes (component
  # infra/k8s/platform/base/observability/tracing sets TRACING_ENABLED and the endpoint)
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,redis
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
