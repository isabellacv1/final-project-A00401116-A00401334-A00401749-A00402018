server {
    # Unprivileged image: nginx runs as a non-root user, so it cannot bind to 80.
    listen 8080;
    server_name _;

    # Do not announce the nginx version (OWASP ZAP 10036 and 20020)
    server_tokens off;

    # Security headers (OWASP ZAP baseline). The camera stays allowed for the QR scanner.
    # A location with its own add_header does not inherit these, so they are repeated there.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    # Content Security Policy (OWASP ZAP 10038). The only inline script of the Expo static export is
    # `globalThis.__EXPO_ROUTER_HYDRATE__=true;`, allowed by its sha256. react-native-web injects
    # <style> tags and style attributes at runtime, so style-src needs 'unsafe-inline' (documented
    # in .zapignore.yaml). The API is served from the same origin through the Ingress.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-67fhrP0+BkBqmgGGXTtgiVO/9EQs3QruYNU/7fnRkI8='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Runtime configuration changes per environment: never cache it.
    location = /env-config.js {
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-67fhrP0+BkBqmgGGXTtgiVO/9EQs3QruYNU/7fnRkI8='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Bundles have a content hash in their file name, so they can be cached forever.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-67fhrP0+BkBqmgGGXTtgiVO/9EQs3QruYNU/7fnRkI8='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Dynamic route exported by Expo Router as a single HTML file.
    location ~ ^/admin/spatial/[^/]+/floors/[^/]+/?$ {
        try_files "/admin/spatial/[buildingId]/floors/[floorId].html" =404;
    }

    # Expo Router static output: /login -> /login.html, /admin -> /admin/index.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /+not-found.html;
}
