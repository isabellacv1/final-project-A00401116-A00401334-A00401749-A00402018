server {
    # Unprivileged image: nginx runs as a non-root user, so it cannot bind to 80.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Runtime configuration changes per environment: never cache it.
    location = /env-config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Bundles have a content hash in their file name, so they can be cached forever.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Dynamic route exported by Expo Router as a single HTML file.
    location ~ ^/admin/spatial/[^/]+/floors/[^/]+/?$ {
        try_files "/admin/spatial/[buildingId]/floors/[floorId].html" =404;
    }

    # Expo Router static output: /login -> /login.html, /admin -> /admin/index.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /+not-found.html;
}
