# Infrastructure (middleware) for CircleGuard.
#
# Alone, it is the local development stack for running the services with Gradle:
#   docker compose -f docker-compose.dev.yml up -d
#
# Together with docker-compose.app.yml it runs the whole platform in containers:
#   docker compose -f docker-compose.dev.yml -f docker-compose.app.yml up -d --build
#
# Credentials are external (HU-34), like in the application layer: Compose takes
# them from the `.env` file at the repository root or from the shell. The same
# file feeds the application layer, so the password PostgreSQL is created with is
# exactly the one the services authenticate with.
#
# Inside a healthcheck, `$$VAR` is used instead of `${VAR}`: the `$$` escapes the
# interpolation, so the `$` reaches the container's shell and is expanded there
# with the value the container actually received.
#
# Every container has a healthcheck so the application services can wait until
# their dependencies are really ready (depends_on: condition: service_healthy).
#
# Resilience (HU-28): every container runs with `restart: unless-stopped`, so Docker
# starts it again when its process exits (crash, ExitOnOutOfMemoryError, host reboot).
# The healthcheck detects a running service that cannot serve requests; it does not
# restart it. See docs/operaciones/patrones.md.

services:
  postgres:
    image: postgres:16
    container_name: circleguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (deploy/secrets/<environment>-secrets.env)}
      POSTGRES_DB: circleguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - circleguard-net
    healthcheck:
      # -h localhost forces a TCP check, so the container is not reported ready
      # while the entrypoint is still running init-db.sql on the temporary server.
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j:
    image: neo4j:5.26
    container_name: circleguard-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # Only NEO4J_AUTH here: the image turns every other NEO4J_* variable into a
      # neo4j.conf setting and aborts on unknown ones (e.g. NEO4J_PASSWORD).
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required (deploy/secrets/<environment>-secrets.env)}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_connector_bolt_listen__address: :7687
      NEO4J_dbms_connector_bolt_advertised__address: :7687
    volumes:
      - neo4jdata:/data
    networks:
      - circleguard-net
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USERNAME:-neo4j} -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: circleguard-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - circleguard-net
    healthcheck:
      test: ["CMD-SHELL", "zookeeper-shell localhost:2181 ls / > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: circleguard-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: PLAINTEXT for apps on the host, INTERNAL for containers.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - circleguard-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.2
    container_name: circleguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - circleguard-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  openldap:
    image: osixia/openldap:1.5.0
    container_name: circleguard-ldap
    restart: unless-stopped
    ports:
      - "389:389"
      - "636:636"
    environment:
      LDAP_ORGANISATION: "CircleGuard"
      LDAP_DOMAIN: "circleguard.edu"
      LDAP_ADMIN_PASSWORD: ${LDAP_PASSWORD:?LDAP_PASSWORD is required (deploy/secrets/<environment>-secrets.env)}
    networks:
      - circleguard-net
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -D cn=admin,dc=circleguard,dc=edu -w $$LDAP_ADMIN_PASSWORD -b dc=circleguard,dc=edu -s base dn > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  circleguard-net:
    name: circleguard-net
    driver: bridge

volumes:
  pgdata:
  neo4jdata:
